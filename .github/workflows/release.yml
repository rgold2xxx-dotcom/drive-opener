# ホストの exe とインストーラーを GitHub のランナー（Windows）で自動ビルドする。
# - タグ host-v<版>（例 host-v1.0.0）を push すると、ビルドしてリリースの「下書き」に添付する
#   （公開は GitHub の画面で下書きを確認してから行う）
# - Actions の画面から手動実行（workflow_dispatch）すると、ビルドして成果物（artifact）だけを残す
# - リリースの説明文は release-notes/<版>.md（変更点。英語→日本語の順）に、共通の文を英語・日本語で付けて作る
#   （tools/make_release_notes.py）。手動実行でも組み立てて、ログとジョブの概要（Summary）に出す（下書きは作らない）
#   タグのときに release-notes/<版>.md がなければエラーで止める。手動実行のときは警告だけ
# コード署名を入れるときは、下の「（署名する場合）」の位置に署名の工程を足す
name: build-host

on:
  push:
    tags: ['host-v*']
  workflow_dispatch:

permissions:
  contents: write   # リリースの下書きを作るため

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: ツールの導入（PyInstaller・Inno Setup）
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller
          choco install innosetup --no-progress -y

      - name: テスト
        shell: pwsh
        run: python -m unittest discover -s tests -v

      - name: バージョンの確認（タグと host/drive_opener.py の VERSION が同じか）
        id: ver
        shell: pwsh
        run: |
          $v = (Select-String -Path host/drive_opener.py -Pattern '^VERSION = "([0-9.]+)"').Matches[0].Groups[1].Value
          "version=$v" >> $env:GITHUB_OUTPUT
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "host-v$v") {
            throw "タグ $env:GITHUB_REF_NAME と VERSION ($v) が合っていません（host-v$v にしてください）"
          }

      - name: リリースの説明文を組み立てる（英語・日本語）
        shell: pwsh
        run: |
          $v = '${{ steps.ver.outputs.version }}'
          $out = Join-Path $env:RUNNER_TEMP 'RELEASE_NOTES.md'
          $require = @()
          if ($env:GITHUB_REF_TYPE -eq 'tag') { $require = @('--require') }
          python tools/make_release_notes.py --version $v --out $out @require
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Host "----- タイトル: Drive Opener host app $v / ホスト $v -----"
          Get-Content $out -Encoding utf8
          "## リリースの説明文（$v）`n" | Out-File $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          "タイトル: **Drive Opener host app $v / ホスト $v**`n`n---`n" | Out-File $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          Get-Content $out -Encoding utf8 | Out-File $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append

      - name: ビルド（exe とインストーラー）
        shell: pwsh
        run: ./build.ps1

      # （署名する場合）ここで、ビルドした exe とインストーラーに署名し、署名済みのファイルに置き換える

      - name: リリース用のファイルを用意（版なしの名前と SHA-256）
        shell: pwsh
        run: |
          $v = '${{ steps.ver.outputs.version }}'
          Copy-Item "dist/DriveOpenerSetup-$v.exe" "dist/DriveOpenerSetup.exe"
          Get-FileHash "dist/DriveOpenerSetup-$v.exe", "dist/DriveOpenerSetup.exe" -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)" } |
            Set-Content -Encoding ascii dist/SHA256SUMS.txt
          Get-Content dist/SHA256SUMS.txt

      - uses: actions/upload-artifact@v7
        with:
          name: DriveOpenerSetup-${{ steps.ver.outputs.version }}
          path: |
            dist/DriveOpenerSetup-${{ steps.ver.outputs.version }}.exe
            dist/DriveOpenerSetup.exe
            dist/SHA256SUMS.txt

      - name: リリースの下書きを作る（タグのときだけ）
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = '${{ steps.ver.outputs.version }}'
          gh release create "$env:GITHUB_REF_NAME" `
            "dist/DriveOpenerSetup-$v.exe" "dist/DriveOpenerSetup.exe" "dist/SHA256SUMS.txt" `
            --draft --title "Drive Opener host app $v / ホスト $v" `
            --notes-file (Join-Path $env:RUNNER_TEMP 'RELEASE_NOTES.md')
